                <div class="flex flex-col items-start gap-2">

                        <label for="marki-radio">

                <div class="flex flex-col items-start gap-0.5">

                        </a>
                        <span class="mb-0.5 hidden self-end text-sm lg:inline" style="font-variant: small-caps">nr konta bankowego</span>

                </div>
            </div>

            <div class="relative w-full overflow-hidden rounded-xl pb-[66%] text-right md:size-[40rem] md:pb-0">
                <div id="marki-map" class="absolute top-0 left-0 size-full">
                    <iframe
                        class="absolute top-0 left-0 size-full"
                        frameborder="0"
                        scrolling="no"
                        marginheight="0"
                        marginwidth="0"
                        src="https://maps.google.com/maps?width=600&height=400&hl=en&q=Poradnia%20Dietetyczna%2C%20Syl.VIA-Sylwia%20Majewska&t=&z=14&ie=UTF8&iwloc=B&output=embed"></iframe>
                </div>
                <div id="zabki-map" class="absolute top-0 left-0 size-full hidden">
                    <iframe
                        class="absolute top-0 left-0 size-full"
                        frameborder="0"
                        scrolling="no"
                        marginheight="0"
                        marginwidth="0"
                        src="https://maps.google.com/maps?width=600&height=400&hl=en&q=Blossom%20Pilates%20Studio%20Z%C4%85bki&t=&z=14&ie=UTF8&iwloc=B&output=embed"></iframe>

    <div id="account-number-copied-toast" class="toast opacity-0 transition-opacity duration-300">
        <div class="alert bg-sylvia text-primary-content border-none">
            <span class="message">Numer konta został skopiowany do schowka.</span>
        </div>
    </div>

    <script>
        var addressRadios = document.querySelectorAll('input[name="address"]');
        var markiMap = document.getElementById('marki-map');
        var zabkiMap = document.getElementById('zabki-map');

        addressRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.id === 'marki-radio') {
                    markiMap.classList.remove('hidden');
                    zabkiMap.classList.add('hidden');
                } else if (e.target.id === 'zabki-radio') {
                    markiMap.classList.add('hidden');
                    zabkiMap.classList.remove('hidden');
                }
            });
        });
    </script>
</main>
